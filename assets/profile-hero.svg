<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rohan Halaj profile hero</title>
  <desc id="desc">A cinematic developer command center banner for Rohan Halaj.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.45" stop-color="#071827"/>
      <stop offset="1" stop-color="#180914"/>
    </linearGradient>
    <linearGradient id="neon" x1="120" y1="60" x2="1040" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102033" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0D16" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.72 0 0 0 0 1 0 0 0 0.75 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .dash { stroke-dasharray: 12 14; animation: dash 8s linear infinite; }
      .float { animation: float 5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <path d="M-20 304C164 244 318 278 496 247C700 212 804 110 1220 142" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.45" class="dash"/>
  <path d="M-10 342C180 296 325 322 514 292C764 252 892 190 1215 220" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.18"/>

  <g filter="url(#softShadow)">
    <rect x="64" y="54" width="1072" height="312" rx="26" fill="#050A12" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>

  <g transform="translate(94 84)">
    <rect x="0" y="0" width="176" height="34" rx="17" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.35"/>
    <circle cx="19" cy="17" r="5" fill="#22D3EE" class="pulse"/>
    <text x="34" y="22" class="mono" font-size="13" fill="#BAE6FD">AVAILABLE TO BUILD</text>

    <text x="0" y="106" class="sans" font-size="66" font-weight="800" letter-spacing="0" fill="#F8FAFC">Rohan Halaj</text>
    <text x="3" y="146" class="sans" font-size="22" font-weight="650" fill="#CBD5E1">Full-stack developer turning rough ideas into shipped software.</text>
    <text x="3" y="181" class="mono" font-size="16" fill="#67E8F9">AI apps / RAG workflows / realtime systems / hackathon builds</text>

    <g transform="translate(0 218)">
      <rect width="122" height="38" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="18" y="25" class="mono" font-size="14" fill="#E0F2FE">LINKEDIN</text>
      <rect x="138" width="92" height="38" rx="12" fill="#0F172A" stroke="#FB7185" stroke-opacity="0.35"/>
      <text x="158" y="25" class="mono" font-size="14" fill="#FFE4E6">EMAIL</text>
      <rect x="246" width="96" height="38" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="266" y="25" class="mono" font-size="14" fill="#EDE9FE">GITHUB</text>
    </g>
  </g>

  <g transform="translate(835 118)" class="float">
    <circle cx="176" cy="154" r="118" stroke="#38BDF8" stroke-opacity="0.22"/>
    <circle cx="176" cy="154" r="84" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="8 10"/>
    <circle cx="176" cy="154" r="47" fill="#08111F" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <path d="M176 107L195 154L176 201L157 154L176 107Z" fill="#22D3EE" fill-opacity="0.2" stroke="#67E8F9"/>
    <path d="M107 154H245M176 85V223" stroke="#E2E8F0" stroke-opacity="0.16"/>
    <circle cx="92" cy="87" r="7" fill="#FB7185"/>
    <circle cx="282" cy="127" r="6" fill="#22D3EE"/>
    <circle cx="250" cy="245" r="5" fill="#A78BFA"/>
    <text x="54" y="284" class="mono" font-size="13" fill="#94A3B8">prototype velocity: high</text>
  </g>

  <g transform="translate(760 74)">
    <rect x="-22" y="0" width="338" height="86" rx="18" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text x="0" y="32" class="mono" font-size="14" fill="#94A3B8">hackathon.signal</text>
    <text x="0" y="62" class="sans" font-size="30" font-weight="750" fill="#F8FAFC">6 podium finishes</text>
  </g>

  <g transform="translate(760 276)">
    <rect x="-22" y="0" width="338" height="62" rx="18" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <text x="0" y="25" class="mono" font-size="13" fill="#67E8F9">$ ship --from idea --with polish</text>
    <text x="0" y="46" class="mono" font-size="13" fill="#CBD5E1">status: building useful things</text>
  </g>

  <rect x="65" y="365" width="1070" height="1" fill="url(#neon)" opacity="0.62"/>
</svg>
